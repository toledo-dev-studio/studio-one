<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="Studio One - platform to manage your musical compositions" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FBFAFD" />
    <title>Studio One</title>
    <script>
      // Apply the stored theme before the first paint to avoid a flash.
      (() => {
        const stored = localStorage.getItem("theme");
        const isDark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", isDark);
        document.documentElement.style.colorScheme = isDark ? "dark" : "light";
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", isDark ? "#0B0910" : "#FBFAFD");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
