name: studio-one

services:
  # Development: Vite dev server with hot reload.
  # http://localhost
  frontend:
    container_name: studio-one-frontend
    build:
      context: .
      dockerfile: docker/development/frontend.dockerfile
    ports:
      - '80:80'
    volumes:
      # Application source
      - ./frontend:/app
      # Anonymous volume to keep the Linux node_modules installed in the image
      - /app/node_modules
    environment:
      VITE_ENVIRONMENT: ${VITE_ENVIRONMENT:-development}
      VITE_API_URL: ${VITE_API_URL:-http://localhost/api}
      VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
      VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
      VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
      VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
      VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
      VITE_FIREBASE_AUTH_EMULATOR_URL: ${VITE_FIREBASE_AUTH_EMULATOR_URL:-}
    restart: unless-stopped

  # Production: static build served by nginx.
  # http://localhost:8080
  frontend-prod:
    container_name: studio-one-frontend-prod
    profiles:
      - 'prod'
    build:
      context: .
      dockerfile: docker/prod/frontend.dockerfile
      args:
        VITE_ENVIRONMENT: ${VITE_ENVIRONMENT:-production}
        VITE_API_URL: ${VITE_API_URL:-http://localhost/api}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        VITE_FIREBASE_AUTH_EMULATOR_URL: ${VITE_FIREBASE_AUTH_EMULATOR_URL:-}
    ports:
      - '8080:80'
    restart: unless-stopped
