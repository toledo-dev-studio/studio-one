# Netlify configuration for the Studio One frontend.
# The site root is the `frontend` folder, the build output is `frontend/dist`.
# NOTE: this file must live at the repo root — Netlify does not read it from
# `frontend/public`, and Vite would otherwise ship it as a static asset.

[build]
  base = "frontend"
  command = "pnpm build"
  publish = "dist"

# Single page application: every route is served by index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
